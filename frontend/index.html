<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Face Attendance System</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/index.css">
</head>
<body class="portal-page">
    <main class="portal-container" aria-labelledby="portalTitle">
        <section class="portal-card">
            <div class="portal-header">
                <span class="portal-kicker">Attendance Portal</span>
                <h1 id="portalTitle">Face Attendance System</h1>
                <p>Select your login type to continue.</p>
            </div>

            <div class="portal-actions" aria-label="Choose portal">
                <button type="button" class="portal-option staff-option" data-target="staff_log.html">
                    <span class="option-label">Staff</span>
                    <span class="option-copy">Manage verification and attendance.</span>
                </button>

                <button type="button" class="portal-option student-option" data-target="student_log.html">
                    <span class="option-label">Student</span>
                    <span class="option-copy">Upload photo and view verification status.</span>
                </button>
            </div>
        </section>
    </main>

    <script src="js/index.js"></script>
</body>
</html>
